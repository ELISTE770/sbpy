# דוגמה לשילוב SBpy ב-CI.
# המעבר המקומי רץ בכל push (חינם, בלי מפתח API).
# ההסלמה ל-Gemini רצה רק על pull requests, ורק על מה שהשתנה.
name: SBpy

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  local:
    name: בדיקה מקומית (בלי API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: SBpy - באגים ואבטחה
        run: |
          sbpy sfb . --offline --format github --fail-on error
          sbpy sec . --offline --format github --fail-on critical

      - name: SARIF ל-code scanning
        if: always()
        run: sbpy sfb . --offline --format sarif > sbpy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sbpy.sarif

  deep:
    name: סקירה עמוקה (Gemini)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gemini]"
      - name: SBpy על מה שהשתנה בלבד
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SBPY_LANG: en
          SBPY_MAX_CALLS_RUN: "5"
        run: sbpy sfb --changed --base origin/${{ github.base_ref }} --format github --fail-on error
